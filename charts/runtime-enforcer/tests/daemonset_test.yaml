suite: "Agent DaemonSet Tests"
templates:
  - "templates/agent/daemonset.yaml"

tests:
  - it: "should allow image, and imagePullPolicy to be overridden"
    set:
      agent:
        image:
          repository: somewhere/agent
          tag: v9.9.9
          pullPolicy: Always
    asserts:
      - equal:
          path: "spec.template.spec.containers[0].image"
          value: "somewhere/agent:v9.9.9"
      - equal:
          path: "spec.template.spec.containers[0].imagePullPolicy"
          value: "Always"
      - equal:
          path: "spec.template.spec.priorityClassName"
          value: "runtime-enforcer-priorityclass"

  - it: "should not include learning flag when there is no selector"
    set:
      learning:
        # this `null` overwrites the default in our values.yaml while with {}
        # we will have a merge
        namespaceSelector: null
    asserts:
      - notContains:
          path: "spec.template.spec.containers[0].args"
          content: '--learning-namespace-selector={"matchExpressions":[{"key":"kubernetes.io/metadata.name","operator":"Exists"}]}'

  - it: "should include default selector"
    set:
      learning:
        # with {} we have a merge with the default in our values.yaml
        namespaceSelector: {}
    asserts:
      - contains:
          path: "spec.template.spec.containers[0].args"
          content: '--learning-namespace-selector={"matchExpressions":[{"key":"kubernetes.io/metadata.name","operator":"Exists"}]}'

  - it: "should render a custom learning namespace selector"
    set:
      learning:
        namespaceSelector:
          matchExpressions: null
          matchLabels:
            env: prod
    asserts:
      - contains:
          path: "spec.template.spec.containers[0].args"
          content: '--learning-namespace-selector={"matchLabels":{"env":"prod"}}'

  - it: "should include grpc port argument"
    set:
      agent:
        grpcExporterPort: "12"
    asserts:
      - contains:
          path: "spec.template.spec.containers[0].args"
          content: "--grpc-port=12"

  - it: "check tolerations"
    set:
      agent:
        tolerations:
          - key: "dedicated"
            operator: "Equal"
            value: "experimental"
            effect: "NoSchedule"
    asserts:
      - contains:
          path: spec.template.spec.tolerations
          content:
            key: "dedicated"
            operator: "Equal"
            value: "experimental"
            effect: "NoSchedule"

  - it: "should include log level argument"
    set:
      agent:
        logLevel: debug
    asserts:
      - contains:
          path: "spec.template.spec.containers[0].args"
          content: "--log-level=debug"

  - it: "should add extra pod environment variables"
    set:
      agent:
        env:
          - name: EXTRA_ENV
            value: extra_value
    asserts:
      - contains:
          path: "spec.template.spec.containers[0].env"
          content:
            name: EXTRA_ENV
            value: extra_value

  - it: "should add extra pod labels"
    set:
      agent:
        podLabels:
          environment: staging
          team: platform
    asserts:
      - equal:
          path: spec.template.metadata.labels.environment
          value: staging
      - equal:
          path: spec.template.metadata.labels.team
          value: platform

  - it: "should add extra pod annotations"
    set:
      agent:
        podAnnotations:
          prometheus.io/scrape: "true"
          prometheus.io/port: "9090"
    asserts:
      - equal:
          path: spec.template.metadata.annotations["prometheus.io/scrape"]
          value: "true"
      - equal:
          path: spec.template.metadata.annotations["prometheus.io/port"]
          value: "9090"

  - it: "should set nodeSelector"
    set:
      agent:
        nodeSelector:
          kubernetes.io/os: linux
          disk: ssd
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector["kubernetes.io/os"]
          value: linux
      - equal:
          path: spec.template.spec.nodeSelector.disk
          value: ssd

  - it: "should not render nodeSelector when empty"
    set:
      agent:
        nodeSelector: {}
    asserts:
      - notExists:
          path: spec.template.spec.nodeSelector

  - it: "should set affinity"
    set:
      agent:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: kubernetes.io/arch
                      operator: In
                      values:
                        - amd64
    asserts:
      - equal:
          path: spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions[0].key
          value: kubernetes.io/arch

  - it: "should not render affinity when empty"
    set:
      agent:
        affinity: {}
    asserts:
      - notExists:
          path: spec.template.spec.affinity

  - it: "should set OTEL env vars to built-in collector when collectorStrategy is default"
    set:
      telemetry:
        collectorStrategy: default
    asserts:
      - contains:
          path: "spec.template.spec.containers[0].env"
          content:
            name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: "https://RELEASE-NAME-runtime-enforcer-otel-collector.NAMESPACE.svc.cluster.local:4317"
      - contains:
          path: "spec.template.spec.containers[0].env"
          content:
            name: OTEL_EXPORTER_OTLP_CERTIFICATE
            value: "/etc/runtime-enforcer/certs/ca.crt"

  - it: "should set OTEL env vars to external endpoint with insecure when no CA cert"
    set:
      telemetry:
        collectorStrategy: external
        externalCollector:
          endpoint: "https://my-collector:4317"
    asserts:
      - contains:
          path: "spec.template.spec.containers[0].env"
          content:
            name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: "https://my-collector:4317"
      - contains:
          path: "spec.template.spec.containers[0].env"
          content:
            name: OTEL_EXPORTER_OTLP_INSECURE
            value: "true"

  - it: "should set OTEL certificate env var when CA cert secret is provided"
    set:
      telemetry:
        collectorStrategy: external
        externalCollector:
          endpoint: "https://my-collector:4317"
          otelCollectorCertificateSecret: "my-ca-cert"
    asserts:
      - contains:
          path: "spec.template.spec.containers[0].env"
          content:
            name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: "https://my-collector:4317"
      - contains:
          path: "spec.template.spec.containers[0].env"
          content:
            name: OTEL_EXPORTER_OTLP_CERTIFICATE
            value: "/tmp/otel-collector-certs/ca.crt"
      - notContains:
          path: "spec.template.spec.containers[0].env"
          content:
            name: OTEL_EXPORTER_OTLP_INSECURE
          any: true

  - it: "should not set OTEL env vars when collectorStrategy is none"
    set:
      telemetry:
        collectorStrategy: none
    asserts:
      - notContains:
          path: "spec.template.spec.containers[0].env"
          content:
            name: OTEL_EXPORTER_OTLP_ENDPOINT
          any: true

  - it: "should reject invalid collectorStrategy values"
    set:
      telemetry:
        collectorStrategy: "invalid"
    asserts:
      - failedTemplate:
          errorPattern: collectorStrategy

  - it: "should mount OCI hook dir and pass oci-hook flags (install is oci-hook-install DaemonSet)"
    asserts:
      - notExists:
          path: spec.template.spec.initContainers
      - contains:
          path: "spec.template.spec.containers[0].args"
          content: "--oci-hook-socket=/opt/oci/oci-hook.sock"
      - contains:
          path: "spec.template.spec.containers[0].args"
          content: "--oci-hook-bin=/opt/oci/oci-hook"
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: oci-hook-path
            mountPath: /opt/oci
      - contains:
          path: spec.template.spec.volumes
          content:
            name: oci-hook-path
            hostPath:
              path: /opt/oci
              type: DirectoryOrCreate
