suite: "Values contract: common"
templates:
  - "templates/controller/deployment.yaml"
  - "templates/agent/daemonset.yaml"
  - "templates/debugger/deployment.yaml"
set:
  debugger:
    enabled: true
tests:
  - it: "should ignore common.imageRegistry"
    set:
      common:
        imageRegistry: mirror.example.com
    asserts:
      - matchRegex:
          path: "spec.template.spec.containers[0].image"
          pattern: "^ghcr\\.io/kubewarden/runtime-enforcer/"

  - it: "should ignore common.imageRegistry when the workload imageRegistry is empty"
    set:
      common:
        imageRegistry: mirror.example.com
      controller:
        imageRegistry: ""
      agent:
        imageRegistry: ""
      debugger:
        imageRegistry: ""
    asserts:
      - matchRegex:
          path: "spec.template.spec.containers[0].image"
          pattern: "^kubewarden/runtime-enforcer/"

  # The debugger has no log level, so this case checks the controller and the agent only.
  - it: "should render common.logLevel on every workload"
    templates:
      - "templates/controller/deployment.yaml"
      - "templates/agent/daemonset.yaml"
    set:
      common:
        logLevel: warn
    asserts:
      - contains:
          path: "spec.template.spec.containers[0].args"
          content: "--log-level=warn"

  - it: "should render common.tolerations on every workload"
    set:
      common:
        tolerations:
          - operator: Exists
    asserts:
      - equal:
          path: "spec.template.spec.tolerations"
          value:
            - operator: Exists

  - it: "should render common.nodeSelector on every workload"
    set:
      common:
        nodeSelector:
          kubernetes.io/os: linux
    asserts:
      - equal:
          path: "spec.template.spec.nodeSelector"
          value:
            kubernetes.io/os: linux

  - it: "should render common.extraEnv on every workload"
    set:
      common:
        extraEnv:
          - name: FROM_COMMON
            value: "yes"
    asserts:
      - contains:
          path: "spec.template.spec.containers[0].env"
          content:
            name: FROM_COMMON
            value: "yes"

  # runtime-enforcer cases
  - it: "should render the defaults on every workload"
    asserts:
      - equal:
          path: "spec.template.spec.containers[0].imagePullPolicy"
          value: IfNotPresent
      - matchRegex:
          path: "spec.template.spec.containers[0].image"
          pattern: "^ghcr\\.io/kubewarden/runtime-enforcer/"
      - notExists:
          path: "spec.template.spec.imagePullSecrets"
      - notExists:
          path: "spec.template.spec.containers[0].envFrom"

  - it: "should render common.imagePullSecrets on every workload"
    set:
      common:
        imagePullSecrets:
          - name: registry-credentials
    asserts:
      - equal:
          path: "spec.template.spec.imagePullSecrets"
          value:
            - name: registry-credentials

  - it: "should accept plain Secret names in common.imagePullSecrets"
    set:
      common:
        imagePullSecrets:
          - registry-credentials
    asserts:
      - equal:
          path: "spec.template.spec.imagePullSecrets"
          value:
            - name: registry-credentials

  - it: "should render common.imagePullPolicy on every workload"
    set:
      common:
        imagePullPolicy: Always
    asserts:
      - equal:
          path: "spec.template.spec.containers[0].imagePullPolicy"
          value: Always

  - it: "should render the default logLevel on the controller and the agent"
    templates:
      - "templates/controller/deployment.yaml"
      - "templates/agent/daemonset.yaml"
    asserts:
      - contains:
          path: "spec.template.spec.containers[0].args"
          content: "--log-level=info"

  - it: "should render common.logLevel on the controller and the agent"
    templates:
      - "templates/controller/deployment.yaml"
      - "templates/agent/daemonset.yaml"
    set:
      common:
        logLevel: debug
    asserts:
      - contains:
          path: "spec.template.spec.containers[0].args"
          content: "--log-level=debug"
      - notContains:
          path: "spec.template.spec.containers[0].args"
          content: "--log-level=info"

  - it: "should not render common.logLevel on the debugger"
    templates:
      - "templates/debugger/deployment.yaml"
    set:
      common:
        logLevel: debug
    asserts:
      - notExists:
          path: "spec.template.spec.containers[0].args"

  - it: "should render common.labels on every workload"
    set:
      common:
        labels:
          team: security
    asserts:
      - equal:
          path: "metadata.labels.team"
          value: security
      - notExists:
          path: "spec.template.metadata.labels.team"

  - it: "should render common.annotations on every workload"
    set:
      common:
        annotations:
          example.com/owner: security
    asserts:
      - equal:
          path: "metadata.annotations[\"example.com/owner\"]"
          value: security
      - notExists:
          path: "spec.template.metadata.annotations[\"example.com/owner\"]"

  - it: "should render common.podLabels on every workload"
    set:
      common:
        podLabels:
          team: security
    asserts:
      - equal:
          path: "spec.template.metadata.labels.team"
          value: security
      - notExists:
          path: "metadata.labels.team"

  - it: "should render common.podAnnotations on every workload"
    set:
      common:
        podAnnotations:
          example.com/owner: security
    asserts:
      - equal:
          path: "spec.template.metadata.annotations[\"example.com/owner\"]"
          value: security
      - exists:
          path: "spec.template.metadata.annotations[\"kubectl.kubernetes.io/default-container\"]"

  - it: "should render common.affinity on every workload"
    set:
      common:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: kubernetes.io/arch
                      operator: In
                      values: [amd64]
    asserts:
      - equal:
          path: "spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions[0].key"
          value: kubernetes.io/arch

  - it: "should render common.topologySpreadConstraints on every workload"
    set:
      common:
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
    asserts:
      - equal:
          path: "spec.template.spec.topologySpreadConstraints"
          value:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway

  - it: "should render common.priorityClassName on every workload"
    set:
      common:
        priorityClassName: system-cluster-critical
    asserts:
      - equal:
          path: "spec.template.spec.priorityClassName"
          value: system-cluster-critical

  - it: "should render common.extraEnvFrom on every workload"
    set:
      common:
        extraEnvFrom:
          - configMapRef:
              name: proxy-env
    asserts:
      - equal:
          path: "spec.template.spec.containers[0].envFrom"
          value:
            - configMapRef:
                name: proxy-env

  - it: "should render common.extraVolumes on every workload"
    set:
      common:
        extraVolumes:
          - name: extra-ca
            configMap:
              name: extra-ca
    asserts:
      - contains:
          path: "spec.template.spec.volumes"
          content:
            name: extra-ca
            configMap:
              name: extra-ca

  - it: "should render common.extraVolumeMounts on every workload"
    set:
      common:
        extraVolumeMounts:
          - name: extra-ca
            mountPath: /etc/extra-ca
            readOnly: true
    asserts:
      - contains:
          path: "spec.template.spec.containers[0].volumeMounts"
          content:
            name: extra-ca
            mountPath: /etc/extra-ca
            readOnly: true

  - it: "should render common.otel on the controller and the agent"
    templates:
      - "templates/controller/deployment.yaml"
      - "templates/agent/daemonset.yaml"
    set:
      common:
        otel:
          endpoint: "https://collector.example.com:4317"
          caSecretName: otel-ca
          clientCertificateSecretName: otel-client
    asserts:
      - contains:
          path: "spec.template.spec.containers[0].env"
          content:
            name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: "https://collector.example.com:4317"
      - contains:
          path: "spec.template.spec.volumes"
          content:
            name: otel-ca
            secret:
              secretName: otel-ca
      - contains:
          path: "spec.template.spec.volumes"
          content:
            name: otel-client-tls
            secret:
              secretName: otel-client

  - it: "should not render common.otel on the debugger"
    templates:
      - "templates/debugger/deployment.yaml"
    set:
      common:
        otel:
          endpoint: "https://collector.example.com:4317"
          caSecretName: otel-ca
          clientCertificateSecretName: otel-client
    asserts:
      - notContains:
          path: "spec.template.spec.containers[0].env"
          content:
            name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: "https://collector.example.com:4317"
      - notContains:
          path: "spec.template.spec.volumes"
          content:
            name: otel-ca
            secret:
              secretName: otel-ca
