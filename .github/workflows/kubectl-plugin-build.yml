name: Build and Upload kubectl plugin

on:
  workflow_call:
    inputs:
      version:
        type: string

  push:
    branches:
      - "main"
jobs:
  upload-kubectl-plugin:
    name: Upload kubectl plugin
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: "go.mod"
      - name: Build kubectl plugin for all platforms
        run: make kubectl-plugin-cross
      - name: Upload plugin artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kubectl-plugin
          path: bin/kubectl-plugin/
          if-no-files-found: error
          retention-days: 7
      - name: Build wpgen for all platforms
        run: make wpgen-cross
      - name: Upload wpgen artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wpgen
          path: bin/wpgen-dist/
          if-no-files-found: error
          retention-days: 7
