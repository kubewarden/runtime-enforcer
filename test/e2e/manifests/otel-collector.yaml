# OpenTelemetry collector for the e2e tests.
# The chart does not deploy a collector. The e2e suite applies this manifest
# in the runtime enforcer namespace before it installs the chart.
# The receiver is plaintext gRPC, so the chart endpoint uses http://.
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/component: otel-collector
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
    connectors:
      count:
        logs:
          runtime_enforcer_violations:
            description: "Total policy violations detected by runtime-enforcer"
            conditions:
              - 'body == "policy_violation"'
            attributes:
              - key: policy.name
              - key: k8s.namespace.name
              - key: action
              - key: node.name
          runtime_enforcer_acknowledge:
            description: "Total acknowledged violations by runtime-enforcer"
            conditions:
              - 'body == "policy_violation_acknowledged"'
            attributes:
              - key: policy.name
              - key: k8s.namespace.name
              - key: action
              - key: node.name
    processors:
      deltatocumulative: {}
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    exporters:
      debug:
        verbosity: normal
      prometheus:
        endpoint: 0.0.0.0:9090
    service:
      extensions: [health_check]
      pipelines:
        logs:
          receivers: [otlp]
          exporters: [count, debug]
        metrics:
          receivers: [count, otlp]
          processors: [deltatocumulative]
          exporters: [prometheus]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/component: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
      app.kubernetes.io/component: otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector
        app.kubernetes.io/component: otel-collector
    spec:
      containers:
      - name: otel-collector
        image: otel/opentelemetry-collector-contrib:0.164.0
        imagePullPolicy: IfNotPresent
        command:
        - /otelcol-contrib
        - --config=/etc/otel/config.yaml
        ports:
        - name: otlp-grpc
          containerPort: 4317
          protocol: TCP
        - name: prometheus
          containerPort: 9090
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /
            port: 13133
        readinessProbe:
          httpGet:
            path: /
            port: 13133
        resources:
          limits:
            cpu: 250m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: otel-collector-config
          mountPath: /etc/otel
          readOnly: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: otel-collector-config
        configMap:
          name: otel-collector
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/component: otel-collector
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/component: otel-collector
  ports:
  - name: otlp-grpc
    port: 4317
    targetPort: otlp-grpc
    protocol: TCP
  - name: prometheus
    port: 9090
    targetPort: prometheus
    protocol: TCP
