# nameOverride replaces the chart name used when generating resource names,
# while still keeping the release name as a prefix (e.g. `<release-name>-<nameOverride>`).
# Leave empty to use the chart name.
nameOverride: ""
# fullnameOverride fully replaces the generated resource name prefix
# (`<release-name>-<chart-name>`) for all resources created by this chart.
# Leave empty to use the default generated name.
fullnameOverride: ""

# namespaceOverride sets the namespace for all namespaced resources of this chart.
# Leave empty to use the release namespace.
namespaceOverride: ""

# global holds the settings for all workloads: controller, agent, and debugger.
# A parent chart can also set these keys.
# A `common` block with the same keys is also accepted. It applies to all
# workloads of this chart only, and it wins over global.
global:
  # Registry for all chart images.
  # If you set it, it replaces the imageRegistry of every workload block.
  imageRegistry: ""
  # Secrets that the kubelet uses to pull the chart images.
  # Each item is a Secret name or a map with a name key,
  # for example [my-secret] or [{name: my-secret}].
  # The chart adds the items of global, common, and the workload block, in this order.
  imagePullSecrets: []
  # Pull policy for the chart images: Always, IfNotPresent, or Never.
  imagePullPolicy: IfNotPresent
  # Log level for the controller and the agent: debug, info, warn, or error.
  # The debugger has no log level, so this key has no effect on it.
  logLevel: info # @schema enum: [debug, info, warn, error]
  # Labels for the workload objects (Deployments and DaemonSet).
  # @schema additionalProperties:true
  labels: {}
  # Annotations for the workload objects (Deployments and DaemonSet).
  # @schema additionalProperties:true
  annotations: {}
  # Labels for the pods.
  # @schema additionalProperties:true
  podLabels: {}
  # Annotations for the pods.
  # @schema additionalProperties:true
  podAnnotations: {}
  # Node labels that a node must have to run the pods.
  # @schema additionalProperties:true
  nodeSelector: {}
  # Tolerations for the pods.
  # @schema itemRef: $k8s/_definitions.json#/definitions/io.k8s.api.core.v1.Toleration; item:object
  tolerations: []
  # Affinity rules for the pods.
  # @schema $ref: $k8s/_definitions.json#/definitions/io.k8s.api.core.v1.Affinity
  affinity: {}
  # Topology spread constraints for the pods.
  # @schema itemRef: $k8s/_definitions.json#/definitions/io.k8s.api.core.v1.TopologySpreadConstraint; item:object
  topologySpreadConstraints: []
  # PriorityClass for the pods. It overrides priorityClass.name for the controller and the agent.
  # The chart still creates its own PriorityClass unless priorityClass.enabled is false.
  priorityClassName: ""
  # Extra environment variables for all containers.
  # @schema itemRef: $k8s/_definitions.json#/definitions/io.k8s.api.core.v1.EnvVar; item:object
  extraEnv: []
  # Extra envFrom sources (ConfigMaps or Secrets) for all containers.
  # @schema itemRef: $k8s/_definitions.json#/definitions/io.k8s.api.core.v1.EnvFromSource; item:object
  extraEnvFrom: []
  # Extra volumes for the pods.
  # @schema itemRef: $k8s/_definitions.json#/definitions/io.k8s.api.core.v1.Volume; item:object
  extraVolumes: []
  # Extra volume mounts for all containers.
  # @schema itemRef: $k8s/_definitions.json#/definitions/io.k8s.api.core.v1.VolumeMount; item:object
  extraVolumeMounts: []
  serviceAccount:
    # Annotations for the ServiceAccounts of the workloads.
    # @schema additionalProperties:true
    annotations: {}
  # Telemetry export configuration.
  # The controller and the agent export telemetry. The debugger does not.
  # The chart does not deploy an OpenTelemetry collector.
  otel:
    # OTLP gRPC endpoint to export telemetry to, e.g. https://otel-collector:4317.
    # TLS is enabled by the https:// scheme.
    # Leave empty to disable telemetry export.
    endpoint: ""
    # Name of secret containing the CA certificate used to verify the collector server certificate.
    # This secret must contain a `ca.crt` key with the CA certificate in PEM format.
    # Without this secret, TLS trusts only public CAs.
    # A collector with a certificate from an internal CA needs this secret.
    caSecretName: ""
    # Name of secret containing the client certificate and key used to authenticate to the collector (mTLS).
    # This secret must contain `tls.crt` and `tls.key` keys.
    clientCertificateSecretName: ""

# Telemetry export configuration for this chart.
# The controller and agent workloads export telemetry. The debugger does not.
# When a key is set here, it wins over the workload otel and global.otel.
otel:
  # OTLP gRPC endpoint to export telemetry to, e.g. https://otel-collector:4317.
  # TLS is enabled by the https:// scheme.
  # Leave empty to disable telemetry export.
  endpoint: ""
  # Name of secret containing the CA certificate used to verify the collector server certificate.
  # This secret must contain a `ca.crt` key with the CA certificate in PEM format.
  caSecretName: ""
  # Name of secret containing the client certificate and key used to authenticate to the collector (mTLS).
  # This secret must contain `tls.crt` and `tls.key` keys.
  clientCertificateSecretName: ""

# Each workload block also accepts every key of global.
# A value in a workload block replaces the value in global and common.
# Maps (labels, annotations, nodeSelector, affinity, ...) merge, and the workload wins on a duplicate key.
# Lists of named items (extraEnv, extraVolumes, extraVolumeMounts, imagePullSecrets) add up.
# Exception: global.imageRegistry wins over the workload imageRegistry.
# The otel key has no effect in the debugger block, because the debugger does not export telemetry.
controller:
  image:
    # The image path used by controller, without the registry.
    # @schema required
    repository: kubewarden/runtime-enforcer/controller
    # The image tag used by controller
    # @schema required
    tag: v0.10.1
  # Registry for the images of this workload.
  # global.imageRegistry replaces it when set.
  imageRegistry: ghcr.io
  replicas: 1
  wpStatusUpdateInterval: 30s
  # To make the Pods "Guaranteed" (evicted last under node pressure), kubelet requires
  # requests and limits are specified for all the containers and they are equal.
  # Please refer to https://kubernetes.io/docs/concepts/scheduling-eviction/node-pressure-eviction/#pod-selection-for-kubelet-eviction
  # @schema $ref: $k8s/_definitions.json#/definitions/io.k8s.api.core.v1.ResourceRequirements
  resources:
    # @schema hidden
    limits:
      cpu: 250m
      memory: 256Mi
    # @schema hidden
    requests:
      cpu: 250m
      memory: 256Mi
  # The podSecurityContext used by runtime-enforcer controller
  # @schema $ref: $k8s/_definitions.json#/definitions/io.k8s.api.core.v1.PodSecurityContext
  podSecurityContext:
    # @schema hidden
    runAsNonRoot: true
    # @schema hidden
    seccompProfile:
      type: RuntimeDefault
  # The containerSecurityContext used by runtime-enforcer controller
  # @schema $ref: $k8s/_definitions.json#/definitions/io.k8s.api.core.v1.SecurityContext
  containerSecurityContext:
    # @schema hidden
    runAsUser: 1000
    # @schema hidden
    allowPrivilegeEscalation: false
    # @schema hidden
    capabilities:
      drop:
        - ALL
  # PodDisruptionBudget for the pods.
  # If you set minAvailable or maxUnavailable, the chart creates the PodDisruptionBudget.
  # @schema additionalProperties:true
  podDisruptionBudget: {}

agent:
  image:
    # The image path used by agent, without the registry.
    # @schema required
    repository: kubewarden/runtime-enforcer/agent
    # The image tag used by agent
    # @schema required
    tag: v0.10.1
  # Registry for the images of this workload.
  # global.imageRegistry replaces it when set.
  imageRegistry: ghcr.io
  grpcExporterPort: "50051"
  # To make the Pods "Guaranteed" (evicted last under node pressure), kubelet requires
  # requests and limits are specified for all the containers and they are equal.
  # Please refer to https://kubernetes.io/docs/concepts/scheduling-eviction/node-pressure-eviction/#pod-selection-for-kubelet-eviction
  # @schema $ref: $k8s/_definitions.json#/definitions/io.k8s.api.core.v1.ResourceRequirements
  resources:
    # @schema hidden
    limits:
      cpu: 250m
      memory: 256Mi
    # @schema hidden
    requests:
      cpu: 250m
      memory: 256Mi
  # hostPID must remain true: the agent reads /proc/1/ns/mnt to learn the host
  # init mount namespace, which lets the eBPF program recognize (and silently
  # skip) OCI runtime bootstrap execs such as `runc init` that run in the host
  # mount namespace before entering the container. Assumes the container runtime
  # (containerd/shim/runc) runs in the host init mount namespace, as on typical
  # nodes; on nodes that isolate the runtime in a private mount namespace this
  # detection is disabled (fail-open) and runtime execs may still be reported.
  hostPID: true
  # The podSecurityContext used by agent
  # @schema $ref: $k8s/_definitions.json#/definitions/io.k8s.api.core.v1.PodSecurityContext
  podSecurityContext:
    # @schema hidden
    runAsNonRoot: false
    # @schema hidden
    seccompProfile:
      type: RuntimeDefault
    # this is required for us the access the cgroup setting on the host
    # @schema hidden
    appArmorProfile:
      type: Unconfined
    # this is required for us the access the cgroup setting on the host with SELinux enabled
    # @schema hidden
    seLinuxOptions:
      type: spc_t
  # The containerSecurityContext used by agent
  # @schema $ref: $k8s/_definitions.json#/definitions/io.k8s.api.core.v1.SecurityContext
  containerSecurityContext:
    # Some environments could require full privileges according to their specific security policies.
    # To do that put `privileged: true` and `allowPrivilegeEscalation: true`.
    # @schema hidden
    privileged: false
    # @schema hidden
    allowPrivilegeEscalation: false
    # Minimal capabilities required for eBPF operations:
    # - CAP_BPF: Required for loading eBPF programs
    # - CAP_PERFMON: Required for attaching tracing programs (kprobes/tracepoints)
    # - CAP_SYS_RESOURCE: Required for removing memlock limits (rlimit.RemoveMemlock)
    # - CAP_SYS_PTRACE: Required to access host cgroup filesystem
    # @schema hidden
    capabilities:
      add:
        - BPF
        - PERFMON
        - SYS_RESOURCE
        - SYS_PTRACE
      drop:
        - ALL
  nriSocketPath: /var/run/nri/
  nriFailopen: false

# The debugger is off by default.
# It has no log level and does not export telemetry,
# so logLevel and otel have no effect on it.
debugger:
  enabled: false
  interval: 30s
  image:
    # The image path used by debugger, without the registry.
    # @schema required
    repository: kubewarden/runtime-enforcer/debugger
    # The image tag used by debugger
    # @schema required
    tag: v0.10.1
  # Registry for the images of this workload.
  # global.imageRegistry replaces it when set.
  imageRegistry: ghcr.io
  # @schema $ref: $k8s/_definitions.json#/definitions/io.k8s.api.core.v1.ResourceRequirements
  resources:
    # @schema hidden
    limits:
      cpu: 250m
      memory: 256Mi
    # @schema hidden
    requests:
      cpu: 250m
      memory: 256Mi
  # The podSecurityContext used by debugger pods
  # @schema $ref: $k8s/_definitions.json#/definitions/io.k8s.api.core.v1.PodSecurityContext
  podSecurityContext: {}
  # @schema $ref: $k8s/_definitions.json#/definitions/io.k8s.api.core.v1.SecurityContext
  containerSecurityContext:
    # @schema hidden
    runAsUser: 1000
    # @schema hidden
    allowPrivilegeEscalation: false
    # @schema hidden
    capabilities:
      drop:
        - ALL
  # PodDisruptionBudget for the pods.
  # If you set minAvailable or maxUnavailable, the chart creates the PodDisruptionBudget.
  # @schema additionalProperties:true
  podDisruptionBudget: {}

# Learning mode configuration
learning:
  # The default value enables learning inside all namespaces of the cluster.
  # Override namespaceSelector to limit the learning scope.
  # Set namespaceSelector to {} to disable learning for all namespaces.
  # @schema $ref: $k8s/_definitions.json#/definitions/io.k8s.apimachinery.pkg.apis.meta.v1.LabelSelector
  namespaceSelector:
    # @schema hidden
    matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: Exists

kubernetesClusterDomain: cluster.local

# PriorityClass shared by both controller and agent pods.
# A priorityClassName in global, common, or a workload block overrides this class for that workload.
priorityClass:
  enabled: true
  name: runtime-enforcer-priorityclass
  value: 1000000
  globalDefault: false
  description: PriorityClass for runtime-enforcer controller and agent pods.
