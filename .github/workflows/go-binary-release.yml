name: Build and attest the Go binaries (kubectl plugin and wpgen)

# This workflow gives the binaries SLSA Build L3.
#
# `actions/attest` signs with the OIDC token of the job that runs it. Any step
# in that job can ask for the same token. If the compiler and `actions/attest`
# run in one job, a build step can forge the provenance.
#
# This workflow uses two jobs to prevent that:
#   - The `build` job runs the compiler and syft. It has no `id-token`
#     permission, so it cannot sign.
#   - The `attest` job signs. It does not check out the repository, so it runs
#     no code from the repository.
#
# The OIDC token names this file in `job_workflow_ref`. A verifier pins this
# file with `--signer-workflow`.
#
# Every file name in this workflow is exact. No step uses a glob, a pattern,
# or a merge, so an unexpected file can never become a subject or a release
# asset.
#
# Handoff between jobs: every job of the run shares the artifact names, and a
# job can overwrite an artifact that another job uploaded. An exact name does
# not prevent that. Each upload step gives an artifact ID, and an overwrite
# creates a new ID. The ID goes to the next job as a job output, which another
# job cannot change. The next job downloads the artifact by that ID. If
# another job replaces the artifact, the ID does not exist anymore and the
# download fails.

permissions: {}

on:
  workflow_call:
    inputs:
      version:
        description: Version that the build puts in the binaries. Use the git tag.
        type: string
        required: true
    # The caller must download the artifacts with these IDs, not by name.
    outputs:
      kubectl-plugin-artifact-id:
        description: ID of the artifact with the kubectl plugin binaries, checksums and SBOM files.
        value: ${{ jobs.build.outputs.kubectl-plugin-artifact-id }}
      wpgen-artifact-id:
        description: ID of the artifact with the wpgen binaries, checksums and SBOM files.
        value: ${{ jobs.build.outputs.wpgen-artifact-id }}
      kubectl-plugin-signatures-artifact-id:
        description: ID of the artifact with the signature bundles of the kubectl plugin.
        value: ${{ jobs.attest.outputs.kubectl-plugin-signatures-artifact-id }}
      wpgen-signatures-artifact-id:
        description: ID of the artifact with the signature bundles of wpgen.
        value: ${{ jobs.attest.outputs.wpgen-signatures-artifact-id }}

env:
  PLATFORMS: "linux-amd64 linux-arm64 darwin-amd64 darwin-arm64"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read # Checkout the source. This job must not get id-token.
    outputs:
      kubectl-plugin-artifact-id: ${{ steps.upload-kubectl-plugin.outputs.artifact-id }}
      wpgen-artifact-id: ${{ steps.upload-wpgen.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: false
      - name: Build kubectl plugin for all platforms
        env:
          VERSION: ${{ inputs.version }}
        run: make kubectl-plugin-cross KUBECTL_PLUGIN_VERSION="${VERSION}"
      - name: Build wpgen for all platforms
        env:
          VERSION: ${{ inputs.version }}
        run: make wpgen-cross WPGEN_VERSION="${VERSION}"
      - name: Generate checksums
        run: |
          set -euo pipefail
          read -ra platforms <<< "${PLATFORMS}"
          for platform in "${platforms[@]}"; do
            (cd bin/kubectl-plugin && sha256sum "kubectl-runtime_enforcer-${platform}" > "kubectl-runtime_enforcer-${platform}.sha256")
            (cd bin/wpgen-dist && sha256sum "wpgen-${platform}" > "wpgen-${platform}.sha256")
          done
      - name: Install the syft command
        uses: kubewarden/github-actions/syft-installer@4d25ea5d35d22768786526f592b0f9ba27587c9c # v8.0.0
      # A Go binary contains the list of its Go modules. Syft reads that list
      # from the binary, so the SBOM describes exactly what the binary contains.
      - name: Create SBOM files
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          read -ra platforms <<< "${PLATFORMS}"
          for platform in "${platforms[@]}"; do
            for file in "bin/kubectl-plugin/kubectl-runtime_enforcer-${platform}" "bin/wpgen-dist/wpgen-${platform}"; do
              syft scan "file:${file}" \
                --output "spdx-json=${file}-sbom.spdx.json" \
                --source-name "$(basename "${file}")" \
                --source-version "${VERSION}"
            done
          done
      - name: Upload plugin artifacts
        id: upload-kubectl-plugin
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kubectl-plugin
          path: bin/kubectl-plugin/
          if-no-files-found: error
      - name: Upload wpgen artifacts
        id: upload-wpgen
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wpgen
          path: bin/wpgen-dist/
          if-no-files-found: error

  attest:
    name: Attest ${{ matrix.binary }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: kubectl-plugin
            binary: kubectl-runtime_enforcer
            artifact-id: ${{ needs.build.outputs.kubectl-plugin-artifact-id }}
          - artifact: wpgen
            binary: wpgen
            artifact-id: ${{ needs.build.outputs.wpgen-artifact-id }}
    permissions:
      contents: read
      id-token: write # actions/attest and cosign
      attestations: write # actions/attest
    outputs:
      kubectl-plugin-signatures-artifact-id: ${{ steps.signatures.outputs.kubectl-plugin-signatures-artifact-id }}
      wpgen-signatures-artifact-id: ${{ steps.signatures.outputs.wpgen-signatures-artifact-id }}
    steps:
      # If `artifact-ids` is empty, the download step gets every artifact of
      # the run. Stop here if the ID is not a number.
      - name: Make sure that the artifact ID is a number
        env:
          ARTIFACT_ID: ${{ matrix.artifact-id }}
        run: |
          set -euo pipefail
          if [[ ! "${ARTIFACT_ID}" =~ ^[0-9]+$ ]]; then
            echo "Error: the artifact ID '${ARTIFACT_ID}' is not a number"
            exit 1
          fi

      # This job has no checkout on purpose. The download step uses the ID of
      # the artifact that the `build` job uploaded, not the artifact name. If
      # another job overwrites the artifact, the artifact gets a new ID and
      # this step fails. See the header comment.
      - name: Download the build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ matrix.artifact-id }}
          path: ${{ runner.temp }}/dist

      # The checksum files come from the same artifact as the binaries. This
      # step finds a damaged file. It does not find a replaced artifact; the
      # artifact ID above does that.
      - name: Make sure that the checksums match
        env:
          BINARY: ${{ matrix.binary }}
        run: |
          set -euo pipefail
          read -ra platforms <<< "${PLATFORMS}"
          cd "${RUNNER_TEMP}/dist"
          for platform in "${platforms[@]}"; do
            sha256sum -c "${BINARY}-${platform}.sha256"
          done

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # Keyless signature for each binary and each SBOM file. Verify with:
      #   cosign verify-blob \
      #     --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
      #     --certificate-identity=https://github.com/kubewarden/runtime-enforcer/.github/workflows/go-binary-release.yml@refs/tags/<TAG> \
      #     --bundle <file>.bundle.sigstore <file>
      - name: Sign the binaries and the SBOM files
        env:
          BINARY: ${{ matrix.binary }}
        run: |
          set -euo pipefail
          read -ra platforms <<< "${PLATFORMS}"
          mkdir -p "${RUNNER_TEMP}/signatures"
          for platform in "${platforms[@]}"; do
            for name in "${BINARY}-${platform}" "${BINARY}-${platform}-sbom.spdx.json"; do
              cosign sign-blob --yes \
                --bundle "${RUNNER_TEMP}/signatures/${name}.bundle.sigstore" \
                "${RUNNER_TEMP}/dist/${name}"
            done
          done

      # Signed build provenance for each binary. GitHub stores it in the
      # calling repository. Verify with:
      #   gh attestation verify <binary> \
      #     --repo kubewarden/runtime-enforcer \
      #     --signer-workflow kubewarden/runtime-enforcer/.github/workflows/go-binary-release.yml
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/dist/${{ matrix.binary }}-linux-amd64
            ${{ runner.temp }}/dist/${{ matrix.binary }}-linux-arm64
            ${{ runner.temp }}/dist/${{ matrix.binary }}-darwin-amd64
            ${{ runner.temp }}/dist/${{ matrix.binary }}-darwin-arm64

      # Signed SBOM attestation for each binary. `sbom-path` accepts one file,
      # so each platform has its own step. Verify with the same command as
      # above and the option `--predicate-type https://spdx.dev/Document/v2.3`.
      - name: Attest the SBOM of the linux-amd64 binary
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/dist/${{ matrix.binary }}-linux-amd64
          sbom-path: ${{ runner.temp }}/dist/${{ matrix.binary }}-linux-amd64-sbom.spdx.json
      - name: Attest the SBOM of the linux-arm64 binary
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/dist/${{ matrix.binary }}-linux-arm64
          sbom-path: ${{ runner.temp }}/dist/${{ matrix.binary }}-linux-arm64-sbom.spdx.json
      - name: Attest the SBOM of the darwin-amd64 binary
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/dist/${{ matrix.binary }}-darwin-amd64
          sbom-path: ${{ runner.temp }}/dist/${{ matrix.binary }}-darwin-amd64-sbom.spdx.json
      - name: Attest the SBOM of the darwin-arm64 binary
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/dist/${{ matrix.binary }}-darwin-arm64
          sbom-path: ${{ runner.temp }}/dist/${{ matrix.binary }}-darwin-arm64-sbom.spdx.json

      - name: Upload the signature bundles
        id: upload-signatures
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signatures-${{ matrix.binary }}
          path: ${{ runner.temp }}/signatures/
          if-no-files-found: error

      # Each matrix job writes an output with its own name. If the two matrix
      # jobs wrote the same output name, one ID would replace the other.
      - name: Record the ID of the signatures artifact
        id: signatures
        env:
          ARTIFACT: ${{ matrix.artifact }}
          ARTIFACT_ID: ${{ steps.upload-signatures.outputs.artifact-id }}
        run: echo "${ARTIFACT}-signatures-artifact-id=${ARTIFACT_ID}" >> "${GITHUB_OUTPUT}"
