{{- $ctx := dict "root" $ "workload" "agent" "component" "agent" "fixedPodAnnotations" (dict "kubectl.kubernetes.io/default-container" "agent") }}
{{- $w := .Values.agent }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "runtime-enforcer.fullname" . }}-agent
  namespace: {{ include "runtime-enforcer.namespace" . | quote }}
  {{- include "runtime-enforcer.workloadLabels" $ctx | nindent 2 }}
  {{- with include "runtime-enforcer.workloadAnnotations" $ctx }}{{ . | nindent 2 }}{{ end }}
spec:
  selector:
    matchLabels:
    {{- include "runtime-enforcer.agent.labelSelector" . | nindent 6 }}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 100%
  template:
    metadata:
      {{- include "runtime-enforcer.podLabels" $ctx | nindent 6 }}
      {{- with include "runtime-enforcer.podAnnotations" $ctx }}{{ . | nindent 6 }}{{ end }}
    spec:
      {{- with include "runtime-enforcer.priorityClassName" $ctx }}{{ . | nindent 6 }}{{ end }}
      {{- with include "runtime-enforcer.imagePullSecrets" $ctx }}{{ . | nindent 6 }}{{ end }}
      containers:
      - args:
        {{- if .Values.learning.namespaceSelector }}
        - --learning-namespace-selector={{ .Values.learning.namespaceSelector | toJson }}
        {{- end }}
        - --grpc-port={{ $w.grpcExporterPort }}
        - --grpc-mtls-cert-dir={{ include "runtime-enforcer.grpc.certDir" . }}
        {{- with include "runtime-enforcer.logLevel" $ctx }}
        - --log-level={{ . }}
        {{- end }}
        command:
        - /agent
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        {{- if $w.nriFailopen }}
        - name: NRI_FAILOPEN
          value: "true"
        {{- end }}
        - name: RUNTIME_ENFORCER_WEBHOOK_ENDPOINT
          value: {{ include "runtime-enforcer.fullname" . }}-controller-webhook.{{ include "runtime-enforcer.namespace" . }}.svc
        {{- with include "runtime-enforcer.otelEnv" $ctx }}{{ . | nindent 8 }}{{ end }}
        {{- with include "runtime-enforcer.extraEnv" $ctx }}{{ . | nindent 8 }}{{ end }}
        {{- with include "runtime-enforcer.extraEnvFrom" $ctx }}{{ . | nindent 8 }}{{ end }}
        image: '{{ template "system_default_registry" $ctx }}{{ $w.image.repository }}:{{ $w.image.tag }}'
        imagePullPolicy: {{ include "runtime-enforcer.imagePullPolicy" $ctx }}
        name: agent
        startupProbe:
          httpGet:
            path: /readyz
            port: 8081
          # we give 50s (10s delay + 8 attempts every 5s) for the startup probe to succeed
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 8
        {{- with $w.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with $w.containerSecurityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        volumeMounts:
        - name: nri-socket
          mountPath: /var/run/nri/
          mountPropagation: HostToContainer
          readOnly: true
        - name: grpc-certs
          mountPath: {{ include "runtime-enforcer.grpc.certDir" . }}
          readOnly: true
        {{- with include "runtime-enforcer.otelVolumeMounts" $ctx }}{{ . | nindent 8 }}{{ end }}
        {{- with include "runtime-enforcer.extraVolumeMounts" $ctx }}{{ . | nindent 8 }}{{ end }}
      hostPID: {{ $w.hostPID }}
      {{- with $w.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "runtime-enforcer.fullname" . }}-agent
      terminationGracePeriodSeconds: 10
      {{- with include "runtime-enforcer.nodeSelector" $ctx }}{{ . | nindent 6 }}{{ end }}
      {{- with include "runtime-enforcer.affinity" $ctx }}{{ . | nindent 6 }}{{ end }}
      {{- with include "runtime-enforcer.tolerations" $ctx }}{{ . | nindent 6 }}{{ end }}
      {{- with include "runtime-enforcer.topologySpreadConstraints" $ctx }}{{ . | nindent 6 }}{{ end }}
      volumes:
      - name: nri-socket
        hostPath:
          path: {{ $w.nriSocketPath }}
      - name: grpc-certs
        csi:
          driver: "csi.cert-manager.io"
          readOnly: true
          volumeAttributes:
            csi.cert-manager.io/issuer-name: {{ include "runtime-enforcer.caIssuerName" . }}
            csi.cert-manager.io/issuer-kind: Issuer
            csi.cert-manager.io/dns-names: ${POD_NAME}.${POD_NAMESPACE}
      {{- with include "runtime-enforcer.otelVolumes" $ctx }}{{ . | nindent 6 }}{{ end }}
      {{- with include "runtime-enforcer.extraVolumes" $ctx }}{{ . | nindent 6 }}{{ end }}
