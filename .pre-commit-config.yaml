fail_fast: false
minimum_pre_commit_version: '0'
repos:
  # more info on the usage: https://github.com/golangci/golangci-lint/blob/main/.pre-commit-hooks.yaml
  - repo: https://github.com/golangci/golangci-lint
    rev: 25c5369a93aacb8cccea0d46e1569ca4a194564d # v2.15.0
    hooks:
      - id: golangci-lint-full
        language_version: 1.27.3
        stages: [pre-commit]
      - id: golangci-lint-fmt
        language_version: 1.27.3
        stages: [pre-commit]
  - repo: https://github.com/cpp-linter/cpp-linter-hooks
    rev: b9c5beecf68ccfc196d5136202a1930f8e1a20e2 # v1.8.0
    hooks:
      - id: clang-format
        args:
          - --version=19
      - id: clang-tidy
        args:
          - --version=19
          - --checks=.clang-tidy
        files: ^bpf/.*\.c$
  - repo: https://github.com/yoheimuta/protolint
    rev: c5433e2d6826441fc6150e7eb0ff5ad568100ad5 # v0.58.0
    hooks:
      - id: protolint
