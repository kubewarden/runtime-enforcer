name: Update otel-collector-contrib image

pipelineid: otel/collector-contrib/version

sources:
  otelCollectorContrib:
    name: Get latest otel-collector-contrib version
    kind: dockerimage
    spec:
      image: otel/opentelemetry-collector-contrib
      versionfilter:
        kind: semver
        prerelease: false

targets:
  # The chart does not deploy a collector. The e2e tests deploy one from
  # this manifest.
  otelCollectorE2EManifest:
    name: 'deps(otel): update otel-collector-contrib to {{ source "otelCollectorContrib" }}'
    kind: file
    sourceid: otelCollectorContrib
    scmid: default
    spec:
      file: test/e2e/manifests/otel-collector.yaml
      matchpattern: 'image: otel/opentelemetry-collector-contrib:(\S+)'
      replacepattern: 'image: otel/opentelemetry-collector-contrib:{{ source "otelCollectorContrib" }}'

actions:
  default:
    title: 'deps(otel): update otel-collector-contrib to {{ source "otelCollectorContrib" }}'
    kind: github/pullrequest
    scmid: default
    spec:
      automerge: false
      mergemethod: squash
      description: |
        Automatic otel/opentelemetry-collector-contrib image {{ source "otelCollectorContrib" }} update.
        This PR has been created by automation to keep the otel-collector-contrib image of the e2e tests up to date.
      draft: false
      labels:
        - "chore"
        - "dependencies"

scms:
  default:
    kind: github
    spec:
      user: "{{ .github.author }}"
      email: "{{ .github.email }}"
      owner: "{{ .github.owner }}"
      repository: "runtime-enforcer"
      branch: "{{ .github.branch }}"
      commitusingapi: true
      commitmessage:
        type: "chore"
        scope: deps
        title: "update otel-collector-contrib image"
        hidecredit: true
        footers: "Signed-off-by: RuntimeEnforcer bot <runtime-enforcer-bot@users.noreply.github.com>"
